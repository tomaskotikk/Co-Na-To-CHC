services:
  - type: web
    name: co-na-to-chc
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: SCREEN_KEY
        generateValue: true
      # celý obsah JSON klíče z Firebase (Service accounts › Generate new private key)
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
